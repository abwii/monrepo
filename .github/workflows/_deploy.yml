# Workflow réutilisable : déploie une image déjà construite (GHCR) sur Fly.io.
# Les secrets et variables proviennent de l'environnement GitHub choisi
# (Settings > Environments), pas du dépôt : staging et production sont isolés.
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: staging ou production
        type: string
        required: true
      tag:
        description: "Tag d'image à déployer (vX.Y.Z ou sha-xxxxxxx)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Un seul déploiement à la fois par environnement, sans jamais en interrompre un en cours.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.WEB_URL }}
    env:
      TAG: ${{ inputs.tag }}
      FLY_APP_API: ${{ vars.FLY_APP_API }}
      FLY_APP_WEB: ${{ vars.FLY_APP_WEB }}
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - name: Validate inputs
        env:
          FLY_API_TOKEN_API: ${{ secrets.FLY_API_TOKEN_API }}
          FLY_API_TOKEN_WEB: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|sha-[0-9a-f]{7})$ ]] \
            || { echo "::error::Tag invalide: $TAG (attendu vX.Y.Z ou sha-xxxxxxx)"; exit 1; }
          for v in FLY_API_TOKEN_API FLY_API_TOKEN_WEB FLY_APP_API FLY_APP_WEB API_URL WEB_URL; do
            [[ -n "${!v}" ]] || { echo "::error::$v manquant dans l'environnement GitHub"; exit 1; }
          done

      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      # Le tag d'image est le même pour les deux apps : api et web partent ensemble.
      # Un deploy token Fly est limité à une app : un secret par app, visible de sa seule étape.
      - name: Deploy api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
        run: |
          flyctl deploy --config apps/api/fly.toml --app "$FLY_APP_API" \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}-api:$TAG"

      - name: Deploy web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          flyctl deploy --config apps/web/fly.toml --app "$FLY_APP_WEB" \
            --image "ghcr.io/${GITHUB_REPOSITORY,,}-web:$TAG"

      # Les machines peuvent être arrêtées (scale-to-zero) : on laisse le temps de démarrer.
      - name: Smoke test
        run: |
          for url in "$API_URL/health" "$API_URL/ready" "$WEB_URL/health"; do
            curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors "$url"
            echo
          done
